<h1>Cartelera</h1>

@if (cargando()) {
  <p>Cargando películas...</p>
} @else if (mensajeError()) {
  <p class="error">{{ mensajeError() }}</p>
} @else {
  <div class="cartelera">
    @for (pelicula of peliculas(); track pelicula.id) {
      <app-card-pelicula [pelicula]="pelicula" (seleccionada)="verDetalle($event)" />
    } @empty {
      <p>No hay películas en cartelera.</p>
    }
  </div>
}
