<header class="cabecera">
  <h1>Panel de administración</h1>
  <p class="ayuda">Cargá películas, programá funciones, configurá el candy y los cupones, manejá los usuarios y revisá la actividad.</p>
</header>

<nav class="pestanias">
  @for (pestania of pestanias; track pestania.ruta) {
    @if (auth.puede(pestania.ruta)) {
      <a [routerLink]="pestania.ruta" routerLinkActive="activa">{{ pestania.texto }}</a>
    }
  }
</nav>

<section class="contenido">
  <router-outlet />
</section>
