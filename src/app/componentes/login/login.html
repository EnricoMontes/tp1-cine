<h1>Ingresar</h1>

<form class="form" [formGroup]="formLogin" (ngSubmit)="ingresar()">

  <label for="email">Mail</label>
  <input type="email" id="email" formControlName="email">
  @if (formLogin.controls.email.touched && formLogin.controls.email.invalid) {
    <p class="error">Ingresá un mail válido</p>
  }

  <label for="clave">Contraseña</label>
  <input type="password" id="clave" formControlName="clave">
  @if (formLogin.controls.clave.touched && formLogin.controls.clave.invalid) {
    <p class="error">La contraseña es obligatoria</p>
  }

  @if (mensajeError()) {
    <p class="error">{{ mensajeError() }}</p>
  }

  <button type="submit" [disabled]="formLogin.invalid || cargando()">
    @if (cargando()) { Ingresando... } @else { Ingresar }
  </button>
</form>
